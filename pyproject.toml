[project]
name = "timekpr-next-remote"
version = "0.1.0"
description = "Remote control for Timekpr-nExT via web interface"
authors = [
    {name = "mrjones"},
    {name = "xkonni"}
]
requires-python = ">=3.9,<4.0"
dependencies = [
    "fabric",
    "paramiko",
    "flask",
    "gotify",
    "humanize",
    "pyyaml",
]

[project.scripts]
timekpr-next-web = "timekpr.timekpr_next_web:main"

[tool.poetry]
packages = [{include = "timekpr"}]

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
fabric = "*"
paramiko = "*"
flask = "*"
gotify = "*"
humanize = "*"
pyyaml = "*"

[tool.poetry.group.dev.dependencies]
flake8 = "*"
flake8-pyproject = "*"
black = "*"
isort = "*"
tox = "*"
pytest = "*"

[tool.black]
line-length = 127
target-version = ['py39', 'py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 127
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.flake8]
max-line-length = 127
exclude = [
    ".git",
    "__pycache__",
    ".tox",
    "venv",
    ".venv",
    "build",
    "dist",
    "*.pyc",
    "*.egg-info",
    ".eggs",
    "conf.py",
    "conf.example.py",
]
ignore = ["E203", "W503", "E501", "I100", "I201"]
per-file-ignores = ["__init__.py:F401"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
