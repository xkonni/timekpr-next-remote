[tox]
envlist = py39,py310,py311,py312,py313,flake8,black
skipsdist = True

[testenv]
deps =
    poetry
commands =
    poetry install
    poetry run pytest {posargs}

[testenv:flake8]
deps =
    flake8
    flake8-pyproject
    flake8-docstrings
    flake8-import-order
commands =
    flake8 timekpr/ --count --select=E9,F63,F7,F82 --show-source --statistics
    flake8 timekpr/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

[testenv:black]
deps =
    black
commands =
    black --check --diff timekpr/

[testenv:isort]
deps =
    isort
commands =
    isort --check-only --diff timekpr/

[testenv:lint]
deps =
    flake8
    black
    isort
commands =
    flake8 timekpr/
    black --check timekpr/
    isort --check-only timekpr/

[flake8]
max-line-length = 127
exclude =
    .git,
    __pycache__,
    .tox,
    venv,
    .venv,
    build,
    dist,
    *.pyc,
    *.egg-info,
    .eggs
ignore =
    E203,  # whitespace before ':'
    W503,  # line break before binary operator
    E501,  # line too long (handled by black)
